                        <script type="text/javascript">
                            document.write("<img src='pic/res_update.gif?random=" + Math.random() + "' class='paddingbottom6' />");
                        </script>
                    </a></span><span id="signal_strength" title="signal_strength" i18n="true" class="statusItem"><i data-bind="attr:{'class': signalCssClass}" class="signal">&nbsp;</i></span><span id="connection_status" title="connection_status" i18n="true" class="statusItem"><i data-bind="attr:{'class': connectionCssClass}" class="icon_connection">&nbsp;</i></span><span id="rj45_connection_status" title="rj45_connection_status" i18n="true" data-bind="visible: isShowRj45ConnectionIcon" class="statusItem"><i data-bind="attr:{'class': rj45ConnectionCssClass}" class="icon_connection">&nbsp;</i></span><span id="sms_unread_count" title="sms_unread_count" i18n="true" data-bind="visible: smsUnreadCount() > 0 || showSmsDeleteConfirm()" style="display: none; position: relative;" class="statusItem"><a onclick="return gotoSmsList();" href="javascript: void(0)">
                        <script type="text/javascript">
                            document.write("<img data-bind='visible: smsUnreadCount() > 0 && !showSmsDeleteConfirm()' src='./pic/msg_unread.png?random=" + Math.random() + "' class='paddingbottom6'/>");
                            document.write("<img data-bind='visible: showSmsDeleteConfirm()' src='./pic/msg_full.gif?random=" + Math.random() + "' class='paddingbottom6'/>");
                        </script><sup data-bind="visible: smsUnreadCount() > 0, text: smsUnreadCount" class="smsUnreadCount"></sup>
                    </a></span><span id="statusItemSimStatus" title="sim_status" i18n="true" class="statusItem"><img data-bind="attr: {src: simStatus}" class="paddingbottom6" /></span><span id="roamingStatus" title="roaming_status" i18n="true" data-bind="visible: roamingStatus() == 'R'" style="display: none;" class="statusItem">
                    <script type="text/javascript">
                        document.write("<img src='./pic/res_roaming.png?random=" + Math.random() + "' class='paddingbottom6'/>");
                    </script>
                </span><span id="wifi_status" title="wifi_status" i18n="true" data-bind="visible: hasWifi" class="statusItem"><!--img class="paddingbottom6" id="wifi_status_img" data-bind="attr: {src: wifiStatusImg}"/--><i class="wifi_status" data-bind="attr:{'class': wifiStatusCssClass}">&nbsp;</i></span><span title="battery_level" i18n="true" data-bind="visible: hasBattery" class="statusItem"><img id="batteryCharging" data-bind="attr: {src: batteryPers}" class="paddingbottom6" /></span></div>

        <div id="manageBar" class="row">

    <div id="indexContainer" class="container">
        <div id="mainContainer" style="min-height: 450px;">
            <div id='container'></div>
        </div>

    <div id='result-overlay'>
        <div class='header'></div><br />
        <div class="text-center">
            <div>
                <div id="result-image"></div>
            </div>
            <div id="result_wording"></div>
        </div>
    </div>
    <div id='loading'>
        <div class='header'><span id="loadMsg"></span></div><br />
        <div class="text-center">
            <div><span id="loading_wording" class="message"></span></div><img id="loadingImg" src="pic/res_loading.gif?bG9hZGluZy5naWY=" />
            <div id="loading_container"></div>
        </div>
    </div>
    <div id='progress'>
        <div class='header'><span id="barMsg"></span></div><br />
        <div class="progress-content">
            <div class="progress-bar-container">
                <div id="bar" class="progress-bar"></div>
                <div id="barValue" class="progress-bar-value"></div>
            </div>
            <div id="progress_container" class="progress-prompt"></div>
        </div>
    </div><!-- confirm content -->
    <div id='confirm'>
        <div class='header'><span id="popTitle"></span></div>
        <div id="confirm-message-container">
            <div class='icon'><img id='confirmImg' /></div>
            <div class="confirm-message">
                <div class='message'></div>
                <div class='promptDiv'><input id="promptInput" name="promptInput" type="text" maxlength="25" class="width190" /><br /><label class="promptErrorLabel colorRed"></label></div>
            </div>
        </div>
        <div class='buttons'><input id='okbtn' type="button" data-trans='ok' class="btn btn-default simplemodal-close" /><input id='yesbtn' type="button" data-trans='yes' class="btn btn-default " /><input id='nobtn' type="button" data-trans='no' class="btn btn-default simplemodal-close" /></div>
    </div>
    <div id='popupSettingWindow'>
        <div class='header'>
            <p class="tag-popup-close"><a href="javascript:hidePopupSettingWindow();"></a></p>
        </div>
        <div id="htmlContainer" class="modal-body"></div>
    </div>
