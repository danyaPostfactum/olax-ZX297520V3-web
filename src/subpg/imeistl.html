<div id="innerContainer">
    <div class="row header-row">
        <div class="col-xs-1"><a href="#main"><img alt="" src="pic/direct-back.png"></a></div>
        <div class="col-xs-11">
            <div class="form-title">
                <h1 data-trans='advanced_settings'></h1>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-xs-2">
            <div class="nav_right">
                <ul>
                    <li><a data-trans="sleep_mode" href="#wlan_sleep"></a></li>
                    <li><a data-trans="router_setting" href="#route_set"></a></li>
                    <li><a data-trans="firewall" href="#filter_main"></a></li>
                    <li data-bind="visible:hasUpdateCheck"><a data-trans="update_settings" href="#fota"></a></li>
                    <li data-bind="visible:hasUssd"><a data-trans="USSD" href="#usat"></a></li>
                    <li data-bind="visible:hasDdns"><a data-trans="DDNS" href="#dynamic_dns"></a></li>
                    <li class="active"><a href="#imeistl" data-trans="imeistl"></a></li>
                    <li><a href="#more" data-trans="others"></a></li><!-- <li><a href="#network_mode" data-trans="netmode"></a></li>-->
                </ul>
            </div>
        </div>
        <div class="col-xs-10">
            <form id="frmimei" role="form">
                <div class="form-body">
                    <div class="content">
                        <div class="row form-group"><label data-trans="new_imei" for="tximei" class="col-xs-4 side-right"></label>
                            <div class="col-xs-4"><input name="imeiNewKey" id="imei_new" type="text" size="20" data-bind="value:IMEINew" maxlength="15" class="form-control valid"></div>
                            <div class="form-buttons"><input id="btnimeiApply" type="submit" class="btn btn-primary" data-trans="apply" /></div>
                        </div>
                    </div>
                </div>
            </form>
            <form id="frmttl" role="form">
                <div class="form-body">
                    <div class="content">
                        <div class="row form-group"><label class="col-xs-4 side-right" data-trans="TTL" for="txtttlvalue"></label>
                            <div class="col-xs-4"><input name="txtttlvalue" id="Text2" type="text" size="20" data-bind="value:TTLNew" maxlength="3" class="form-control valid"></div>
                            <div class="form-buttons"><input id="btnTTLApply" type="submit" class="btn btn-primary" data-trans="apply" /></div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
