<div id="innerContainer">
    <div class="row header-row">
        <div class="col-xs-1"><a href="#main"><img alt="" src="pic/direct-back.png"></a></div>
        <div class="col-xs-11">
            <div class="form-title">
                <h1 data-trans='advanced_settings'></h1>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-xs-2">
            <div class="nav_right">
                <ul>
                    <li><a data-trans="sleep_mode" href="#wlan_sleep"></a></li>
                    <li><a data-trans="router_setting" href="#route_set"></a></li>
                    <li><a data-trans="firewall" href="#filter_main"></a></li>
                    <li data-bind="visible:hasUpdateCheck"><a data-trans="update_settings" href="#fota"></a></li>
                    <li data-bind="visible:hasUssd"><a data-trans="USSD" href="#usat"></a></li>
                    <li data-bind="visible:hasDdns"><a href="#dynamic_dns" data-trans="DDNS"></a></li>
                    <li><a data-trans="others" href="#more"></a></li>
                    <li><a href="#imeistl" data-trans="imeistl"></a></li>
                    <li class="active"><a href="#netmode" data-trans="netmode"></a></li>
                </ul>
            </div>
        </div>
        <div class="col-xs-10">
            <form id="EthModeForm">
                <div class="form-body">
                    <h3 data-trans="netmode" class="form-title"></h3>
                    <div class="content">
                        <div class="row form-group"><label data-trans='netmode' class="col-xs-4 side-right"></label>
                            <div class="col-xs-4"><select id="ethSetMode" data-transid="alk_eth_mode" data-bind="options: ethSetModes, value: currentMode, optionsText: transOption('alk_eth_mode'), optionsValue: 'value'" class="form-control"></select> </div>
                        </div>
                    </div>
                    <div class="form-buttons"><input type="submit" data-bind="" data-trans="apply" class="btn btn-primary margin-right-20" /></div>
                </div>
            </form>
        </div>
    </div>
