<div id="innerContainer">
    <div class="row header-row">
        <div class="col-xs-1"><a href="#main"><img alt="" src="pic/direct-back.png"></a></div>
        <div class="col-xs-11">
            <div class="form-title">
                <h1 data-trans='net_setting'></h1>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-xs-2">
            <div class="nav_right">
                <ul>
                    <li><a data-trans="dial_mode" href="#conn_set"></a></li>
                    <li><a data-trans="net_select" href="#network_choose"></a></li>
                    <li><a data-trans="apn_setting" href="#cgdcont_set"></a></li>
                    <li><a data-trans="vpn_setting" href="#vpn_set" data-bind="visible:isSupportVpnsetting"></a></li>
                    <li class="active"><a href="#net_info" data-trans="net_info"></a></li>
                </ul>
            </div>
        </div>
        <div class="col-xs-10">
            <form role="form">
                <div class="form-body">
                    <h3 class="form-title" data-trans="net_info"></h3>
                    <div class="content"><!--<div class="row form-group">--><!--<label class="col-xs-4" data-trans='current_network'></label>--><!--<div class="col-xs-8" data-bind="text: currentNetwork"></div>--><!--</div>-->
                        <div class="row form-group"><label class="col-xs-4 side-right" data-trans='BandIndicator'></label>
                            <div class="col-xs-8">
                                <div class="row">
                                    <div class="col-xs-6"><!--  <select data-transid='bandIndicaitor_type' id="type" class="form-control" data-bind="options: types, value: selectedIndicator, optionsText: transOption('bandIndicaitor_type'), optionsValue: 'value',enable:false"></select>--><input type="text" name="bandIndicaitor_type" class="form-control" data-bind="value: selectedIndicator, disable: false,enable:false" id="bandIndicaitor_type" /></div>
                                </div>
                            </div>
                        </div><!--        <div class="row form-group"><label class="col-xs-4 side-right" data-trans='dial_ping'></label><div class="col-xs-3"><input type="radio" name="ping_google" id="ping_google_enable" class="" data-bind="checked: ping_google, enable: enableFlag" value="yes"/><label for="autoDial" data-trans="enable"></label></div><div class="col-xs-3"><input type="radio" name="ping_google" id="ping_google_disable" class="" data-bind="checked: ping_google" value="no"/><label for="manualMode" data-trans="disable"></label></div></div>-->
                        <div class="row form-group"><label class="col-xs-4 side-right" data-trans='SetBand'></label>
                            <div class="col-xs-8">
                                <div class="row">
                                    <div class="col-xs-6">
                                        <div data-bind="foreach: bandCheckList">
                                            <div class="form-row">
                                                <input type="checkbox" name="band[]" data-bind="checked: checked, attr: {id: 'band-' + value}" />
                                                <label data-bind="text: name, attr: {for: 'band-' + value}"></label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-buttons"><input type="button" class="btn btn-primary" data-bind='click: save' data-trans='apply' /></div>
                            </div>
                        </div><!--   <div class="row form-group"><label class="col-xs-4 side-right" for="CellIDName" data-trans='CellID'></label><div class="col-xs-8"><div class="row"><div class="col-xs-6"><!--<input type="text" name="profile_name" data-bind="value: profileName, disable: false"id="Text1" class="required form-control"  /><input type="text" name="CELLID" class="form-control" data-bind="value: CellIDName, disable: false,enable:false"id="CELLID"  /></div></div><div class="form-buttons"><input type="button" class="btn btn-primary"  data-trans='restart_connection' data-bind="click: restart"/></div></div></div>--><!--    <div class="form-note"><div class="notes-title">&nbsp;</div><ul class="notes-content"><li data-trans="ping_note"></li></ul>-->
                    </div>
                </div>
            </form>
            <div class="content">
                <form id="pciLockForm" role="form" novalidate="novalidate" autocomplete="off">
                    <div class="row form-group">
                        <label class="col-xs-4 side-right" data-trans='pci_lock'></label>
                        <div class="col-xs-8">
                            <div class="row">
                                <div class="col-xs-4"><input type="radio" name="action" id="action_1" data-bind="checked: action" value="1" /><label for="action_1" data-trans="enable"></label></div>
                                <div class="col-xs-4"><input type="radio" name="action" id="action_0" data-bind="checked: action" value="0" /><label for="action_0" data-trans="disable"></label></div>
                            </div>
                        </div>
                    </div>
                    <div class="row" data-bind="visible: action() == 1">
                        <div class="col-xs-8 col-xs-offset-4">
                            <div class="row form-group">
                                <div class="col-xs-4">EARFCN <i class="colorRed">&nbsp;*</i></div>
                                <div class="col-xs-4">PCI <i class="colorRed">&nbsp;*</i></div>
                            </div>
                            <div data-bind="foreach: lteCells">
                                <div class="row form-group">
                                    <div class="col-xs-4"><input data-bind="attr: {name: 'earfcn-' + $index()}, value: earfcn, enable: $parent.action() == 1" type="text" class="earfcn-input required form-control" maxlength="5"></div>
                                    <div class="col-xs-4"><input data-bind="attr: {name: 'pci-' + $index()}, value: pci, enable: $parent.action() == 1" type="text" class="pci-input required form-control" maxlength="3"></div>
                                    <div class="col-xs-4">
                                        <button type="button" data-bind="click: $parent.removeCell, enable: $parent.lteCells().length > 1" class="btn btn-danger">-</button>
                                        <button type="button" data-bind="click: $parent.addCell, enable: $parent.lteCells().length < 10" class="btn btn-primary">+</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- <div class="row form-group"><label class="col-xs-4 side-right" for="uarfcnlte" data-trans="lock_earfcn"><i class="colorRed">&nbsp;*</i></label>
                        <div class="col-xs-6"><input id="uarfcnlte" name="uarfcnlte" data-bind="value: uarfcnlte, enable: actionlte() == 1" type="text"  class="required form-control" maxlength="6"></div>
                    </div>
                    <div class="row form-group"><label class="col-xs-4 side-right" for="cellParaIdlte" data-trans="lock_pci"><i class="colorRed">&nbsp;*</i></label>
                        <div class="col-xs-6"><input id="cellParaIdlte" name="cellParaIdlte" data-bind="value: cellParaIdlte, enable: actionlte() == 1" type="text"  class="required form-control" maxlength="3"></div>
                    </div>-->
                    <div class="form-buttons">
                        <input type="submit" data-trans='apply' class="btn btn-primary"/>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
