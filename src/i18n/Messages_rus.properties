apn_note_dns_mode = Режим DNS: если поставщик услуг предоставляет фиксированный IP-адрес, выберите ручной DNS. В противном случае выберите Авто DNS, и устройство автоматически получит параметры.
apn_note_authentication = Аутентификация: она предоставляется вашим интернет-провайдером (ISP).Протокол аутентификации пароля (PAP) предоставляет простой метод без шифрования для однорангового узла. Challenge-Handshake Authentication Protocol (CHAP) используется для периодической проверки подлинности однорангового узла.
apn_note_username = Имя пользователя: имя пользователя используется для получения аутентификации от поставщика услуг интернета при установке соединения.
