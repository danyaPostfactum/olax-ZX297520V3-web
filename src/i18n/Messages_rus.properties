step4_ssid_explain = Имя сети: идентификатор набора служб (SSID). Введите имя беспроводной локальной сети (WLAN), которое содержит менее 32 символов.
step4_ssid_broadcast_explain1 = Вещание SSID: отключить или включить (по умолчанию) эту функцию. После включения маршрутизатор будет транслировать SSID, а другие устройства могут обнаруживать и подключаться к нему.
step4_ssid_broadcast_explain2 = Отключить вещание SSID: утройство отключает широковещательную передачу и скрывает имя сети.
step5_encryption_mode_info = Режим безопасности:
step5_encryption_mode_explain1 = Открытая сеть: аутентификация и шифрование отключены. Существует риск того, что информация может быть перехвачена или сеть может быть использована неавторизованными лицами. Этот тип шифрования не рекомендуется.
step5_encryption_mode_explain2 = WPA2 (AES)-PSK: это защищенная версия WPA с реализацией стандарта 802.11 i.
step5_encryption_mode_explain3 = Шифрования WPA-PSK или WPA2-PSK: предварительный ключ WPA (WPA-PSK). WPA2-PSK - это защищенная версия WPA с реализацией стандарта 802.11 i.
step5_encryption_mode_explain4 = Парольная фраза: парольная фраза содержит 0-9 a-z A-Z ! # ()+ - . / % = ? @ ^ _ { / } ~
