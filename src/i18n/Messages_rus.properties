wifi_basic_note_network_name_input = Имя сети содержит 0-9 а-Z а-Z ! # ()+ - . / % = ? @ ^ _ { / } ~ и пробел, и оно не может начинаться и заканчиваться пробелом.
wifi_basic_note_broadcast = Вещание SSID: если включить эту функцию, устройство будет транслировать SSID. Другие беспроводные устройства обнаружат и подключатся к этому устройству.
wifi_basic_note_security_mode = Режим безопасности:
wifi_basic_note_no_encryption = Открытая сеть: незашифрованный режим. Есть риски, что сеть будет использоваться неавторизованными лицами. Этот режим шифрования не рекомендуется.
wifi_basic_note_shared = SHARED (WEP): режим проверки подлинности ссылки - это проверка подлинности с общим ключом, метод шифрования-WEP.
wifi_basic_note_wpa_psk_aes = WPA2(AES)-PSK: это защищенная версия WPA с реализацией стандарта 802.11 i.
wifi_basic_note_wpa_psk = WPA-PSK/WPA2-PSK: предварительный ключ WPA (WPA2-PSK). WPA2-PSK - это защищенная версия WPA с реализацией стандарта 802.11 i.
wifi_basic_note_wpa3 = WPA3-Personal: это наследник WPA2.
wifi_basic_note_wpa2_wpa3 = WPA2(AES)/WPA3-Personal: WPA2 - PSK является безопасным вариантом WPA и соответствует стандарту 802.11i.WAP 3 - наследник WPA2.
wifi_basic_note_pass_phrase = Парольная фраза: парольная фраза содержит 0-9 a-z A-Z ! # ()+ - . / % = ? @ ^ _ { / } ~
wifi_basic_note_max_station_number1 = Максимальное число клиентов: вы можете выбрать максимальное количество беспроводных терминалов, которые могут подключаться к устройству.Также рассчитывается точка доступа Wi-Fi, подключенная к интернету Wi-Fi.
wifi_basic_note_max_station_number = Максимальное число клиентов: вы можете выбрать максимальное количество беспроводных терминалов, которые могут подключаться к устройству.

