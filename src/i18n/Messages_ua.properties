ppp_authentication = Аутентифікація PPP
step3_authentication_apn_explain1 = Аутентифікація: ISP — надано вашим інтернет-провайдером. PAP — забезпечує простий метод без шифрування для вузла. CHAP — використовується для періодичної перевірки підлинності вузла.
step3_authentication_apn_explain2 = Ім'я користувача: використовується для аутентифікації з боку провайдера під час встановлення з'єднання.
step3_authentication_apn_explain3 = Пароль: використовується для аутентифікації з боку провайдера під час встановлення з'єднання.
step3_username_password_explain = Натисніть "Встановити за замовчуванням", щоб зробити цей профіль профілем за замовчуванням.
