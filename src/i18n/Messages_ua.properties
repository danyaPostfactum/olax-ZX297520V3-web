ssid_name = Ім'я мережі (SSID)
ssid_broadcast = Трансляція SSID
step4_ssid_explain = Ім'я мережі: ідентифікатор набору послуг (SSID). Введіть назву бездротової локальної мережі (WLAN), яка містить менше 32 символів.
step4_ssid_broadcast_explain1 = Видимість SSID: увімкнути чи вимкнути (за замовчуванням). Після ввімкнення маршрутизатор транслюватиме SSID, а інші пристрої зможуть його знайти та підключитися.
step4_ssid_broadcast_explain2 = Вимкнути видимість SSID: маршрутизатор припинить трансляцію і приховає ім'я мережі.
step5_encryption_mode_info = Режим безпеки:
step5_encryption_mode_explain1 = OPEN: аутентифікація і шифрування вимкнені. Існує ризик, що інформація може бути перехоплена або мережу буде використовуватися неавторизованими користувачами. Цей тип шифрування не рекомендується.
step5_encryption_mode_explain2 = WPA2 (AES)-PSK: це безпечна версія WPA з реалізацією стандарту 802.11 i.
step5_encryption_mode_explain3 = Шифрування WPA-PSK або WPA2-PSK: WPA-PSK — це безпечна версія WPA з реалізацією стандарту 802.11 i.
step5_encryption_mode_explain4 = Парольна фраза: парольна фраза може містити 0-9, a-z, A-Z, ! # ()+ - . / % = ? @ ^ _ { / } ~
