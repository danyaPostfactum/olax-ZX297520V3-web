wifi_basic_note_network_name_input = Назва мережі містить 0- 9 a- z A- Z! # ( ) + - / % = ? @ ^  Name ~ і простору, і він не може почати і закінчитися з простором.
wifi_basic_note_broadcast = Трансляція SSID: якщо ввімкнути цю функцію, пристрій буде транслювати SSID. Інші пристрої зможуть підключатися до цієї мережі.
wifi_basic_note_security_mode = Режим безпеки:
wifi_basic_note_no_encryption = Відкритий: незашифрований режим. Є ризик несанкціонованого використання мережі.
wifi_basic_note_shared = Загальний доступ (WEP): метод аутентифікації з використанням загального ключа. Метод шифрування - WEP.
wifi_basic_note_wpa_psk_aes = WPA2 (AES)-PSK: безпечний протокол WPA з реалізацією стандарту 802.11i.
wifi_basic_note_wpa_psk = WPA-PSK/WPA2-PSK: WPA-PSK - це попередній ключ WPA. WPA2-PSK - покращений варіант WPA.
wifi_basic_note_wpa3 = WPA3: наступник WPA2.
wifi_basic_note_wpa2_wpa3 = WPA2 (AES) / WPA3: WPA2-PSK - це безпечний протокол відповідно до стандарту 802.11i. WPA3 - його наступник.
wifi_basic_note_pass_phrase = Парольна фраза: 0-9, a-z, A-Z, !#()+ -./%=?@ ^ _ { / }~.
wifi_basic_note_max_station_number1 = Максимальна кількість клієнтів: виберіть максимальну кількість терміналів, які можуть підключатися.
wifi_basic_note_max_station_number = Максимальна кількість клієнтів: встановіть ліміт для одночасних підключень.

