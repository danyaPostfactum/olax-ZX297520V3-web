apn_note_whole_page =  Bạn có thể đặt Tên điểm truy cập (APN) trên trang này.
apn_note_mode =  Chế độ: Nếu APN cố định được cung cấp bởi nhà cung cấp dịch vụ của bạn, hãy chọn APN thủ công. Nếu không, vui lòng chọn APN tự động và thiết bị sẽ tự động lấy thông số.
apn_note_profile =  Hồ sơ: Nó chứa một hoặc nhiều tên hồ sơ.
apn_note_pdp_type =  Loại PDP: IPv4/IPv6/IPv4&IPv6.
apn_note_profile_name =  Tên hồ sơ: Nó đề cập đến tên mà bạn gán cho hồ sơ mới.
apn_note_apn =  APN: Tên điểm truy cập. APN chứa 0-9 a-z A-Z . - và nó không thể bắt đầu bằng và kết thúc bằng .hoặc -.
apn_note_dns_mode =  Chế độ DNS: Nếu địa chỉ IP cố định được cung cấp bởi nhà cung cấp dịch vụ của bạn, hãy chọn DNS thủ công. Nếu không, vui lòng chọn DNS tự động và thiết bị sẽ tự động lấy thông số.
apn_note_authentication =  Xác thực: Nó được cung cấp bởi Nhà cung cấp dịch vụ Internet (ISP) của bạn. Giao thức xác thực mật khẩu (PAP) cung cấp một phương thức đơn giản không cần mã hóa để thiết bị ngang hàng thiết lập danh tính bằng cách bắt tay 2 chiều. Giao thức xác thực bắt tay thử thách (CHAP) được sử dụng để xác minh định kỳ danh tính của thiết bị ngang hàng bằng cách sử dụng bắt tay 3 bước.
apn_note_username =  Tên người dùng: Tên người dùng được sử dụng để nhận xác thực từ ISP khi kết nối được thiết lập.
apn_note_password =  Mật khẩu: Mật khẩu được sử dụng để nhận xác thực từ ISP khi kết nối được thiết lập.
apn_note_set_default =  Nhấp vào "Đặt làm mặc định" để đặt cấu hình này làm cấu hình mặc định.

wifi_basic_note_multi_ssid_switch =  Multi SSID Switch: Có thể sử dụng 2 SSID cùng lúc.
wifi_basic_note_network_name = Network Name(SSID): SSID có thể hiểu là tên mạng. Khi thay đổi SSID, vui lòng nhập một chuỗi ít hơn 32 ký tự làm tên cho Wi-Fi của bạn. Chuỗi chứa số, chữ cái (a-z, A-Z), ký tự đặc biệt (!#()+-./%=?@^_{|}~) và dấu cách, đồng thời chuỗi không thể bắt đầu và kết thúc bằng dấu cách.
wifi_basic_note_network_name_input = Tên mạng chứa 0-9 a-z A-Z ! # ( ) + - . / % = ? @ ^ _ { | } ~ và dấu cách, đồng thời nó không thể bắt đầu và kết thúc bằng dấu cách.
wifi_basic_note_broadcast =  SSID Broadcast: Nếu kích hoạt chức năng này, thiết bị sẽ phát SSID. Các thiết bị không dây khác sẽ phát hiện và kết nối với thiết bị này.
wifi_basic_note_security_mode =  Chế độ bảo mật:
wifi_basic_note_no_encryption =  MỞ: Chế độ không được mã hóa. Có những rủi ro rằng mạng sẽ được sử dụng bởi các cá nhân không được phép. Chế độ mã hóa này không được khuyến khích.
wifi_basic_note_shared =  SHARED(WEP): Chế độ xác thực liên kết là xác thực khóa chia sẻ, phương thức mã hóa là WEP.
wifi_basic_note_wpa_psk_aes =  WPA2(AES)-PSK: Đây là phiên bản bảo mật của WPA với việc triển khai tiêu chuẩn 802.11i.
wifi_basic_note_wpa_psk =  WPA-PSK/WPA2-PSK: Khóa chia sẻ trước WPA (WPA-PSK). WPA2-PSK là phiên bản bảo mật của WPA với việc triển khai tiêu chuẩn 802.11i.
wifi_basic_note_wpa3 =  WPA3-Personal: Đây là sự kế thừa của WPA2.
wifi_basic_note_wpa2_wpa3 =  WPA2(AES)/WPA3-Personal: WPA2-PSK là phiên bản bảo mật của WPA với việc triển khai tiêu chuẩn 802.11i. WAP3 là sự kế thừa của WPA2.
wifi_basic_note_pass_phrase = Cụm mật khẩu: Cụm mật khẩu chứa 0-9 a-z A-Z ! # ( ) + - . / % = ? @ ^ _ { | } ~
wifi_basic_note_max_station_number1 =  Số trạm tối đa: Bạn có thể chọn số lượng thiết bị đầu cuối không dây tối đa có thể kết nối với thiết bị. Điểm truy cập Wi-Fi được kết nối bằng Internet Wi-Fi cũng được tính toán.
wifi_basic_note_max_station_number =  Số trạm tối đa: Bạn có thể chọn số lượng thiết bị đầu cuối không dây tối đa có thể kết nối với thiết bị.

wifi_advanced_note_whole_page =  Bạn có thể đặt các ký tự nâng cao Wi-Fi trên trang này.
wifi_advanced_note_band_selection =  Lựa chọn băng tần: Bạn có thể chọn băng tần phù hợp cho thiết bị của mình.
wifi_advanced_note_network_mode =  Chế độ mạng: Chọn chế độ mạng Wi-Fi phù hợp, hiệu suất Wi-Fi của thiết bị sẽ được cải thiện.
wifi_advanced_note_country_code =  Mã Quốc gia/Khu vực: Bạn có thể chọn Mã Quốc gia/Khu vực phù hợp cho thiết bị của mình.
wifi_advanced_note_frequency =  Tần số (Kênh): Chọn kênh thích hợp để tối ưu hóa hiệu suất và vùng phủ sóng của mạng không dây của bạn.

ap_station_note_info =  Vui lòng đảm bảo rằng địa chỉ IP của điểm phát sóng Wi-Fi mà bạn đã kết nối không nằm trong phạm vi địa chỉ IP của thiết bị này, nếu không bạn sẽ không thể truy cập Internet qua điểm phát sóng Wi-Fi.
ap_station_note_disable_info =  Nếu bật nhiều SSID, Internet Wi-Fi sẽ bị tắt.
ap_station_on_info =  Bạn không thể hoạt động khi Wi-Fi được bật!

wif_filter_note1 =  Đặt chế độ lọc địa chỉ MAC trong hộp danh sách thả xuống Bộ lọc MAC của WLAN.
wif_filter_note2 =  Ruleless: Vô hiệu hóa bộ lọc WLAN MAC.
wif_filter_note3 =  Danh sách trắng:Cho phép máy khách kết nối với thiết bị bằng mạng WLAN nếu địa chỉ MAC của máy khách tồn tại trong danh sách Địa chỉ MAC.
wif_filter_note4 =  Danh sách đen: Từ chối kết nối của máy khách với thiết bị bằng mạng WLAN nếu địa chỉ MAC của máy khách tồn tại trong danh sách Địa chỉ MAC.

