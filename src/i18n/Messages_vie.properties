step2_auto_apn_explain =  Tên hồ sơ: Hồ sơ mặc định mà bạn hiện đang sử dụng.
step2_profile_name_explain =  Xác thực PPP
ppp_authentication =  Xác thực: Nó được cung cấp bởi Nhà cung cấp dịch vụ Internet (ISP) của bạn. Giao thức xác thực mật khẩu (PAP) cung cấp một phương thức đơn giản không cần mã hóa để thiết bị ngang hàng thiết lập danh tính của nó bằng cách bắt tay 2 chiều. Giao thức xác thực bắt tay thử thách (CHAP) được sử dụng để xác minh định kỳ danh tính của thiết bị ngang hàng bằng cách sử dụng bắt tay 3 bước.
step3_authentication_apn_explain1 =  Tên người dùng: Nó được sử dụng để nhận được xác thực từ ISP khi kết nối được thiết lập.
step3_authentication_apn_explain2 =  Mật khẩu: Nó được sử dụng để nhận được xác thực từ ISP khi kết nối được thiết lập.
step3_authentication_apn_explain3 =  Nhấp vào "Đặt làm mặc định" để đặt cấu hình này làm cấu hình mặc định.
step3_username_password_explain =  SSID
ssid_title =  Tên Mạng (SSID)
ssid_name =  Phát sóng SSID
ssid_broadcast =  Tên mạng: Mã nhận dạng bộ dịch vụ (SSID). Nhập tên mạng cục bộ không dây (WLAN) của bạn, ít hơn 32 ký tự.
step4_ssid_explain =  SSID Broadcast: Tắt hoặc Bật (Mặc định) chức năng này. Sau khi được bật, bộ định tuyến sẽ phát SSID và các thiết bị khác có thể khám phá và kết nối với nó.
step4_ssid_broadcast_explain1 =  Tắt: Cổng vô hiệu hóa việc phát sóng và ẩn tên mạng của bạn.
step4_ssid_broadcast_explain2 =  Chế độ bảo mật:
step5_encryption_mode_info =  MỞ: Xác thực và mã hóa sẽ không được thực hiện. Có những rủi ro là thông tin cá nhân có thể bị chặn hoặc mạng có thể bị sử dụng trái phép. Lược đồ mã hóa này không được khuyến khích.
step5_encryption_mode_explain1 =  WPA2(AES)-PSK: Đây là phiên bản bảo mật của WPA với việc triển khai tiêu chuẩn 802.11i.
step5_encryption_mode_explain2 =  WPA-PSK/WPA2-PSK: Khóa chia sẻ trước WPA (WPA-PSK). WPA2-PSK là phiên bản bảo mật của WPA với việc triển khai tiêu chuẩn 802.11i.
step5_encryption_mode_explain3 =  Cụm mật khẩu: Cụm mật khẩu chứa 0-9 a-z A-Z ! # ( ) + - . / %
step5_encryption_mode_explain4 = Cụm mật khẩu: Cụm mật khẩu chứa 0-9 a-z A-Z ! # ( ) + - . / % = ? @ ^ _ { | } ~
step6_apply_explain =  1. Wi-Fi bị tắt, cài đặt cho Wi-Fi sẽ không có hiệu lực.<br\>Tiếp tục?
quick_setting_wifi_disable_confirm =  1. Các thiết bị Wi-Fi đã kết nối có thể cần kết nối lại khi cấu hình Wi-Fi thay đổi.<br\>Tiếp tục?
