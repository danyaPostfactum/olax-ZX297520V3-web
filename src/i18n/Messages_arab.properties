apn_note_profile = ملف التكوين: يحتوي على اسم واحد أو أكثر من أسماء ملفات التكوين.
apn_note_pdp_type = نوع PDP: IPv4/IPv6/IPv4&IPv6.
apn_note_profile_name = اسم ملف التعريف: اسم ملف التعريف الجديد الذي تحدده.
apn_note_apn = APN: اسم نقطة الوصول. تتضمن الأحرف الصالحة: 0-9 a-z A-Z - ولا يمكن أن تكون البداية والنهاية أو - .
apn_note_dns_mode = وضع DNS: إذا كان مزود الخدمة الخاص بك يوفر لك عنوان IP ثابت، فحدد "DNS يدوي"، وإذا لم يكن الأمر كذلك، فحدد "Automatic DNS" وسيحصل الجهاز تلقائيًا على المعلمات.
apn_note_authentication = طريقة المصادقة: يتم توفيرها بواسطة موفر خدمة الإنترنت (ISP). يحدد بروتوكول مصادقة كلمة المرور (PAP) هوية النظير من خلال المصافحة دون تشفير. يتحقق بروتوكول مصادقة المصافحة (CHAP) بشكل دوري من هوية النظير من خلال مصافحة ثلاثية.
apn_note_username = اسم المستخدم: يستخدم للحصول على التحقق من مزود خدمة الإنترنت عند إنشاء اتصال.
apn_note_password = كلمة المرور: تستخدم للحصول على التحقق من مزود خدمة الإنترنت الخاص بك عند إنشاء اتصال.
apn_note_set_default = انقر فوق "تعيين كافتراضي" لتعيين ملف التعريف هذا كملف التعريف الافتراضي.

wifi_basic_note_multi_ssid_switch =مفتاح اسم شبكة متعدد: يمكن استخدام اسمين للشبكة في نفس الوقت.
wifi_basic_note_network_name = اسم الشبكة (SSID): يمكن فهم SSID ببساطة على أنه اسم الشبكة اللاسلكية. عند تعديل SSID، يرجى إدخال سلسلة تصل إلى 32 حرفًا في هذا المربع. تتكون السلسلة من أرقام وأحرف (a-z، A-Z) وأحرف خاصة (!#()+-./%.
wifi_basic_note_network_name_input = تتضمن الأحرف الصالحة لأسماء الشبكات: 0-9 a-z A-Z # ( ) + - / %.
wifi_basic_note_broadcast = بث SSID: عند تمكينه، سيقوم الجهاز ببث تعريف الشبكة اللاسلكية (SSID) الخاص به. بهذه الطريقة، يمكن لأجهزة الكمبيوتر القريبة أو العملاء اللاسلكيين الآخرين البحث عن الإشارة اللاسلكية لهذا الموجه والاتصال بالجهاز.
wifi_basic_note_security_mode = الوضع الآمن:
wifi_basic_note_no_encryption = مفتوح: لا يوجد تشفير للبيانات. قد يسمح هذا بإساءة استخدام الشبكة من قبل الآخرين ولا ينصح به.
wifi_basic_note_shared = SHARED (WEP): طريقة مصادقة الارتباط هي طريقة مصادقة المفتاح المشترك، وطريقة التشفير هي تشفير WEP.
wifi_basic_note_wpa_psk_aes = WPA2(AES)-PSK: WPA2(AES)-PSK هو إصدار آمن من Wi-Fi Secure Access (WPA) الذي يطبق معيار الأمان اللاسلكي 802.11i.
wifi_basic_note_wpa_psk = WPA-PSK/WPA2-PSK: مفتاح WPA المشترك مسبقًا (WPA-PSK). WPA2-PSK هو إصدار آمن من Wi-Fi Secure Access (WPA) الذي يطبق معيار الأمان اللاسلكي 802.11i.
wifi_basic_note_wpa3 = WPA3-شخصي: نسخة مطورة من بروتوكول التشفير WPA2.
wifi_basic_note_wpa2_wpa3 = WPA2(AES)/WPA3-Personal: WPA2-PSK هو إصدار آمن من Wi-Fi Secure Access (WPA) الذي يطبق معيار الأمان اللاسلكي 802.11i. WAP3 هو نسخة مطورة من بروتوكول التشفير WPA2.
wifi_basic_note_pass_phrase = كلمة المرور: تتضمن الأحرف الصالحة لكلمة المرور: 0-9 a-z A-Z # ( ) + - / %.
wifi_basic_note_max_station_number1 = الحد الأقصى لعدد مرات الوصول: من خلال هذه العملية، يمكنك تحديد الحد الأقصى لعدد المحطات اللاسلكية المتصلة بالجهاز. تنتمي نقاط اتصال Wi-Fi المتصلة عبر وظيفة Wi-Fi عبر الإنترنت أيضًا إلى معدات الوصول إلى المحطة اللاسلكية لهذا الجهاز.
wifi_basic_note_max_station_number = الحد الأقصى لعدد مرات الوصول: من خلال هذه العملية، يمكنك تحديد الحد الأقصى لعدد المحطات اللاسلكية المتصلة بالجهاز.

wifi_advanced_note_whole_page =يمكنك ضبط أحرف Wi-Fi المتقدمة على هذه الصفحة.
wifi_advanced_note_band_selection = اختيار نطاق التردد: يمكنك تحديد نطاق التردد المناسب لجهازك.
wifi_advanced_note_network_mode = وضع الشبكة: حدد وضع الشبكة اللاسلكية المناسب، وسيتحسن الأداء اللاسلكي للجهاز.
wifi_advanced_note_country_code = رمز البلد: يمكنك تحديد رمز البلد المناسب لجهازك.
wifi_advanced_note_frequency = القناة: اختر القناة المناسبة لتحسين أداء شبكة Wi-Fi وتغطيتها.

ap_station_note_info =يرجى التأكد من أن نطاق عنوان IP الخاص بنقطة اتصال Wi-Fi التي تتصل بها ليس في نفس نطاق نطاق عنوان IP الخاص بهذا الجهاز، وإلا فلن تتمكن من الاتصال بالشبكة من خلال نقطة اتصال Wi-Fi .
