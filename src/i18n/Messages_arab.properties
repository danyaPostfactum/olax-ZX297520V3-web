step3_authentication_apn_explain1 = طريقة المصادقة: يتم توفيرها بواسطة موفر خدمة الإنترنت (ISP). يحدد بروتوكول مصادقة كلمة المرور (PAP) هوية النظير من خلال المصافحة دون تشفير. يتحقق بروتوكول مصادقة المصافحة (CHAP) بشكل دوري من هوية النظير من خلال مصافحة ثلاثية.
step3_authentication_apn_explain2 = اسم المستخدم: يستخدم للحصول على التحقق من مزود خدمة الإنترنت عند إنشاء اتصال.
step3_authentication_apn_explain3 = كلمة المرور: تستخدم للحصول على التحقق من مزود خدمة الإنترنت عند إنشاء اتصال.
step3_username_password_explain = انقر فوق "تعيين كافتراضي" لتعيين ملف التعريف هذا كملف التعريف الافتراضي.
ssid_title = SSID
ssid_name = اسم الشبكة (SSID)
ssid_broadcast = بث SSID
step4_ssid_explain = اسم الشبكة: معرف مجموعة الخدمة (SSID). أدخل اسم الشبكة المحلية اللاسلكية (WLAN)، حتى 32 حرفًا.
step4_ssid_broadcast_explain1 = بث SSID: قم بتعطيل هذه الميزة أو تمكينها (ممكّنة افتراضيًا). بمجرد تمكين هذه الميزة، سيقوم جهاز التوجيه ببث SSID وستكتشف الأجهزة الأخرى الجهاز وتتصل به.
step4_ssid_broadcast_explain2 = معطل: تتوقف البوابة عن بث SSID، مما يؤدي إلى إخفاء اسم شبكتك من الشبكة.
step5_encryption_mode_info = الوضع الآمن:
step5_encryption_mode_explain1 = مفتوح: لا يتم إجراء أي مصادقة أو تشفير. قد يؤدي ذلك إلى اعتراض المعلومات الشخصية أو إساءة استخدام الشبكة من قبل الآخرين، لذلك لا يوصى بهذه الطريقة.
step5_encryption_mode_explain2 = WPA2(AES)-PSK: WPA2(AES)-PSK هو إصدار آمن من Wi-Fi Secure Access (WPA) الذي يطبق معيار الأمان اللاسلكي 802.11i.
step5_encryption_mode_explain3 = WPA-PSK/WPA2-PSK: مفتاح WPA المشترك مسبقًا (WPA-PSK). أدخل المفتاح المشترك مسبقًا ككلمة مرور نص عادي (ASCII). WPA2-PSK هو إصدار آمن من Wi-Fi Secure Access (WPA) الذي يطبق معيار الأمان اللاسلكي 802.11i.
step5_encryption_mode_explain4 = كلمة المرور: تتضمن الأحرف الصالحة لكلمة المرور: 0-9 a-z A-Z # ( ) + - / %.
step6_apply_explain = بمجرد اكتمال الإعداد، ستحتاج إلى إعادة الاتصال بالشبكة اللاسلكية.
quick_setting_wifi_disable_confirm = 1. تم إيقاف تشغيل Wi-Fi، ولن يتم تفعيل الإعدادات المتعلقة بشبكة Wi-Fi. <br\>هل تريد المتابعة؟
quick_setting_param_changed_confirm = 1. قد تحتاج أجهزة Wi-Fi المتصلة إلى إعادة الاتصال بعد تغيير تكوين Wi-Fi. <br\>هل تريد المتابعة؟
