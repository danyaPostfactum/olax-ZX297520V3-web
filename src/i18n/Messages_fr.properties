apn_note_whole_page = Vous pouvez définir le nom du point d'accès (APN) sur cette page.
apn_note_mode = Mode: si votre fournisseur de services vous a fourni un APN fixe, sélectionnez APN manuel. Sinon, veuillez sélectionner Auto APN et l'appareil obtiendra automatiquement les paramètres.
apn_note_profile = Profil: Il contient un ou plusieurs noms de profil.
apn_note_pdp_type = Type de PDP: IPv4 / IPv6 / IPv4 & IPv6.
apn_note_profile_name = Nom du profil: Il fait référence au nom que vous attribuez au nouveau profil.
apn_note_apn = APN: nom du point d'accès. L'APN contient 0-9 a-z A-Z. - et cela ne peut pas commencer et se terminer par.
apn_note_dns_mode = Mode DNS: si votre fournisseur de services vous fournit une adresse IP fixe, sélectionnez DNS manuel. Sinon, sélectionnez DNS automatique et l'appareil obtiendra automatiquement les paramètres.
apn_note_authentication = Authentication: Il est fourni par votre fournisseur de services Internet (FAI). Le protocole PAP (Pautword Authentication Protocol) constitue une méthode simple, sans chiffrement, permettant à l'homologue d'établir son identité à l'aide d'une négociation bidirectionnelle. Le protocole CHAP (Challenge-Handshake Authentication Protocol) est utilisé pour vérifier périodiquement l'identité de l'homologue à l'aide d'une négociation à trois.
apn_note_username = Nom d'utilisateur: le nom d'utilisateur est utilisé pour obtenir l'authentification du fournisseur de services Internet lorsque la connexion est établie.
apn_note_password = Mot de passe: Le mot de passe est utilisé pour obtenir l'authentification du fournisseur de services Internet lorsque la connexion est établie.
apn_note_set_default = Cliquez sur "Définir par défaut" pour définir ce profil comme profil par défaut.

wifi_basic_note_multi_ssid_switch = Multi SSID Switch: 2 SSID peuvent être utilisés en même temps.
wifi_basic_note_network_name = Nom du réseau (SSID): le SSID peut être compris comme nom de réseau. Lorsque vous modifiez le SSID, veuillez entrer une chaîne de moins de 32 caractères comme nom de votre réseau Wi-Fi. La chaîne contient des chiffres, des lettres (a-z, A-Z), des caractères spéciaux (! # () +-./%=?@^_ {|} ~) et de l'espace. Elle ne peut pas commencer et se terminer par un espace.
wifi_basic_note_network_name_input = Le nom du réseau contient 0-9 a-z A-Z! # () + -. /% =? @ ^ _ {| } ~ et l'espace, et il ne peut pas commencer et finir par l'espace.
wifi_basic_note_broadcast = Diffusion SSID: Si cette fonction est activée, le périphérique diffusera le SSID. Les autres appareils sans fil vont découvrir et se connecter à cet appareil.
wifi_basic_note_security_mode = Mode de sécurité:
wifi_basic_note_no_encryption = OPEN: mode non crypté. Il y a des risques que le réseau soit utilisé par des personnes non autorisées. Ce mode de cryptage n'est pas recommandé.
wifi_basic_note_shared = SHARED (WEP): le mode d'authentification de liaison est une authentification à clé partagée, la méthode de cryptage est WEP.
wifi_basic_note_wpa_psk_aes = WPA2 (AES) -PSK: Il s'agit de la version sécurisée de WPA avec implémentation de la norme 802.11i.
wifi_basic_note_wpa_psk = WPA-PSK / WPA2-PSK: clé pré-partagée WPA (WPA-PSK). WPA2-PSK est la version sécurisée de WPA avec implémentation de la norme 802.11i.
wifi_basic_note_wpa3 = Wpa3 person: It is the successor of wpa2.
wifi_basic_note_wpa2_wpa3 = Wpa2 (AES) / wpa3 person: wpa2 - PSK est une version sécurisée de WPA, qui implémente la norme 802.11i.Wap3 est l'héritier de wpa2.
wifi_basic_note_pass_phrase = Phrase secrète: La phrase secrète contient 0-9 a-z A-Z! # () + -. /% =? @ ^ _ {| } ~
wifi_basic_note_max_station_number1 = Nombre maximal de stations: vous pouvez sélectionner le nombre maximal de terminaux sans fil pouvant se connecter à l'appareil. Point d'accès Wi-Fi connecté via Internet Le point d'accès Wi-Fi est également calculé.
wifi_basic_note_max_station_number = Max Station Number: Vous pouvez sélectionner le nombre maximum de terminaux sans fil pouvant se connecter au périphérique.

wifi_advanced_note_whole_page = Vous pouvez définir les caractères avancés Wi-Fi sur cette page.
wifi_advanced_note_band_selection = Sélection de la bande: Vous pouvez sélectionner la bande appropriée pour votre appareil.
wifi_advanced_note_network_mode = Mode réseau: Sélectionnez le mode réseau Wi-Fi approprié. Les performances Wi-Fi du périphérique seront améliorées.
wifi_advanced_note_country_code = Code de pays / région: vous pouvez sélectionner le code de pays / région adapté à votre appareil.
wifi_advanced_note_frequency = Fréquence (canal): sélectionnez le canal approprié pour optimiser les performances et la couverture de votre réseau sans fil.

ap_station_note_info = Assurez-vous que l'adresse IP du point d'accès Wi-Fi que vous avez connecté n'est pas dans la plage de l'adresse IP de cet appareil, ou que vous n'aurez pas accès à Internet via le point d'accès Wi-Fi.
ap_station_note_disable_info = Si vous activez le multi-SSID, Internet Wi-Fi sera désactivé.
ap_station_on_info = Vous ne pouvez pas utiliser le Wi-Fi!

wif_filter_note1 = Définissez le mode de filtrage des adresses MAC dans la liste déroulante Filtre MAC WLAN.
wif_filter_note2 = Sans règle: Désactivez le filtre WLAN MAC.
wif_filter_note3 = Liste blanche: autoriser un client à se connecter au périphérique à l'aide du WLAN si l'adresse MAC du client figure dans la liste des adresses MAC.
wif_filter_note4 = Liste noire: refuse la connexion d'un client au périphérique utilisant le WLAN si l'adresse MAC du client existe dans la liste des adresses MAC.

