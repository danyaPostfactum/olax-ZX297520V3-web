step4_ssid_broadcast_explain1 = Diffusion SSID: Désactivez ou activez (par défaut) cette fonction. Une fois activé, le routeur diffusera le SSID et les autres périphériques pourront le découvrir et s'y connecter.
step4_ssid_broadcast_explain2 = Désactiver: la passerelle désactive la diffusion et masque le nom de votre réseau.
step5_encryption_mode_info = Mode de sécurité:
step5_encryption_mode_explain1 = OPEN: l'authentification et le cryptage ne seront pas effectués. Il existe des risques d'interception d'informations privées ou d'utilisation du réseau par des personnes non autorisées. Ce schéma de cryptage n'est pas recommandé.
step5_encryption_mode_explain2 = WPA2 (AES) -PSK: Il s'agit de la version sécurisée de WPA avec implémentation du standard 802.11i.
step5_encryption_mode_explain3 = WPA-PSK / WPA2-PSK: clé pré-partagée WPA (WPA-PSK). WPA2-PSK est la version sécurisée de WPA avec implémentation de la norme 802.11i.
step5_encryption_mode_explain4 = Phrase secrète: La phrase secrète contient 0-9 a-z A-Z! # () + -. /% =? @ ^ _ {| } ~
