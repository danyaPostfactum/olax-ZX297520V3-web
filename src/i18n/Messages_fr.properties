step3_authentication_apn_explain1 = Authentification: elle est fournie par votre fournisseur de service Internet (FAI). Le protocole PAP (Password Authentication Protocol) constitue une méthode simple, sans cryptage, permettant à l’homologue d’établir son identité à l’aide d’une négociation bidirectionnelle. Le protocole CHAP (Challenge-Handshake Authentication Protocol) est utilisé pour vérifier périodiquement l'identité de l'homologue à l'aide d'une négociation à trois.
step3_authentication_apn_explain2 = Nom d'utilisateur: Il est utilisé pour obtenir l'authentification du fournisseur de services Internet lorsque la connexion est établie.
