step3_authentication_apn_explain1 = Autenticación: lo proporciona el proveedor de servicio de internet (ISP). El protocolo de autenticación de contraseña (PAP) proporciona un método simple sin encriptación para que el par establezca su identidad utilizando una comunicación de 2 vías. El protocolo de autenticación por desafío mutuo (CAHP) se utiliza para verificar periódicamente si el par utiliza una comunicación de 3 vías.
