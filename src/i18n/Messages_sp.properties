apn_note_dns_mode = Modo DNS: si su proveedor de servicios proporciona una dirección IP fija, seleccione DNS manual. De otra forma, por favor seleccione DNS auto para que el dispositivo obtenga automáticamente los parámetros.
apn_note_authentication = Autenticación: se proporciona a través de su Proveedor de Servicios de Internet (ISP). El Protocolo de Autenticación de Contraseña (PAP) ofrece un método simple sin encriptación para que los pares establezcan su identidad utilizando una comunicación de 2 vías. El Protocolo de Autenticación por Desafío Mutuo (CHAP) se utiliza para verificar periódicamente la identidad del par utilizando una comunicación de 3 vías.
apn_note_username = Nombre de usuario: el nombre de usuario se utiliza para obtener la autenticación del ISP cuando se establece la conexión.
apn_note_password = Contraseña: la contraseña se utiliza para obtener la autenticación del ISP cuando se establece la conexión.
apn_note_set_default = Presione “configurar como predeterminado” para configurar este perfil como el perfil predeterminado.

wifi_basic_note_multi_ssid_switch = Interruptor de SSID múltiple: el SSID se puede utilizar al mismo tiempo.
wifi_basic_note_network_name = Nombre de red (SSID): el SSID se entiende como el nombre de red. Cuando cambie el SSID, por favor ingrese una cadena menor a 32 caracteres como el nombre de su Wi-Fi. La cadena contiene números, letras (a-z, A-Z), caracteres especiales (!#()+-./%=?@^_{|}~) y espacios, y no puede empezar o terminar con un espacio.
wifi_basic_note_network_name_input = El nombre de red contiene 0-9 a-z A-Z ! # ( ) + - . / % = ? @ ^ _ { | } ~ y espacios, y no puede empezar o terminar con un espacio.
wifi_basic_note_broadcast = Emisión SSID: si habilita esta función, el dispositivo emitirá el SSID. Otros dispositivos inalámbricos descubrirán su dispositivo y se podrán conectar a él.
wifi_basic_note_security_mode = Modo de seguridad: 
wifi_basic_note_no_encryption = ABIERTO: modo no encriptado. Existe el riesgo de que personas no autorizadas utilicen la red. No se recomienda este modo de encriptación.
wifi_basic_note_shared = SHARED(WEP): El modo de autenticación de vínculo es una autenticación de clave compartida; el método de encriptación es WEP.
wifi_basic_note_wpa_psk_aes = WPA2(AES)-PSK: Es la versión segura de WPA con la implementación del estándar 802.11i.
wifi_basic_note_wpa_psk = WPA-PSK/WPA2-PSK: Clave WPA compartida previamente (WPA-PSK). WPA2-PSK es la versión segura de WPA con la implementación del estándar 802.11i.
wifi_basic_note_wpa3 = WPA 3 personas: es el sucesor de WPA 2.
wifi_basic_note_wpa2_wpa3 = WPA 2 (AES) / WPA 3 personas: WPA 2 - PSK es la versión segura de WPA, implementando el estándar 802.11i.Wap3 es el sucesor de wpa2.
wifi_basic_note_pass_phrase = Pass Phrase: La frase de paso contiene 0-9 a-z A-Z ! # ( ) + - . / % = ? @ ^ _ { | } ~
wifi_basic_note_max_station_number1 = Número máximo de estaciones: puede seleccionar el número máximo de terminales inalámbricas que se pueden conectar al dispositivo. También se calcula el Wi-Fi conectado por medio del Wi-Fi de internet.
wifi_basic_note_max_station_number = Número máximo de estaciones: puede seleccionar el número máximo de terminales inalámbricas que se pueden conectar al dispositivo.

